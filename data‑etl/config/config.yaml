# =============================================================================
# 国元证券 TRAE 金科竞赛 - ETL 配置
# -----------------------------------------------------------------------------
# 安全约定：数据库密码 / MinIO 密钥一律通过环境变量注入，禁止硬编码到本文件。
#   环境变量名：
#     MYSQL_PASSWORD        - MySQL 密码
#     CLICKHOUSE_PASSWORD   - ClickHouse 密码
#     MINIO_SECRET_KEY      - MinIO SecretKey
#   未设置环境变量时，对应字段取本文件的 password/secret_key（默认留空）。
# 路径约定：脚本内部基于 __file__ 自动定位 ../data，不依赖当前工作目录。
# =============================================================================

project:
  name: guoyuan-securities-etl

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  database: gy_meta
  charset: utf8mb4
  connect_timeout: 10
  read_timeout: 60
  write_timeout: 60
  password: ""            # 推荐用环境变量 MYSQL_PASSWORD 覆盖

clickhouse:
  host: 127.0.0.1
  port: 9000              # native 协议端口
  http_port: 8123         # HTTP 端口（可选）
  user: default
  database: gy_dw
  connect_timeout: 10
  send_receive_timeout: 600
  password: ""            # 推荐用环境变量 CLICKHOUSE_PASSWORD 覆盖

minio:
  endpoint: 127.0.0.1:9002   # 官方 9000 已被 ClickHouse native 占用，MinIO 映射 9002/9003
  access_key: minioadmin
  bucket: research-reports
  secure: false
  secret_key: ""          # 推荐用环境变量 MINIO_SECRET_KEY 覆盖

etl:
  batch_size: 50000       # ClickHouse / MySQL 批量写入行数
  report_object_prefix: "reports"   # 研报在 MinIO 中的对象前缀
